syntax = "proto3";
package models;

option go_package = "protocols/users";

// Shop is
message User {
    bytes       user_uuid                  = 1;
    string      username                   = 2;
    string      email                      = 3;
    int64       validation_status          = 4;
    string      first_name                 = 5;
    string      last_name                  = 6;
    string      avatar                     = 7;
    Addresses   addresses              = 8;
    string          phone                  = 9;
}

message Address {
    string city = 1;
    string street = 2;
    string gps = 3;
}
message Addresses{
    repeated Address Addresses = 1;
}
