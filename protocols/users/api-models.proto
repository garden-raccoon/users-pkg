syntax = "proto3";
package models;

option go_package = "protocols/users";

// Shop is
message User {
    bytes       user_uuid                  = 1;
    string      username                   = 2;
    string      email                      = 3;
    int64       validation_status          = 4;
    string      first_name                 = 5;
    string      last_name                  = 6;
    string      avatar                     = 7;
    repeated string addresses              = 8;
    string          phone                  = 9;
    string         ip_address              = 10;
    int64         sign_up_tries             = 11;
}


